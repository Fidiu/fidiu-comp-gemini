name: Build Fidiu Comp (Windows x64 VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/FidiuComp_artefacts/Release/VST3/Fidiu Comp.vst3" dist/
          Compress-Archive -Path "dist/Fidiu Comp.vst3" -DestinationPath FidiuComp-Windows-x64-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FidiuComp-Windows-x64-VST3
          path: FidiuComp-Windows-x64-VST3.zip
